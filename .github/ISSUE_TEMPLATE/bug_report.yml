name: Bug report
description: Something in Blendex doesn't work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search existing issues first. Security problems go through private reporting instead, see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add a library with ...
        2. Hover the card for ...
        3. See ...
    validations:
      required: true
  - type: input
    id: blendex
    attributes:
      label: Blendex version
      description: Settings → Apps shows it, or the release you installed.
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: input
    id: blender
    attributes:
      label: Blender version(s) installed
      placeholder: "5.2.2 LTS"
  - type: dropdown
    id: filetype
    attributes:
      label: File types involved
      multiple: true
      options: [".blend", ".obj", ".fbx", ".glb / .gltf", ".stl / .ply", ".usd*", ".abc", ".ma / .mb", "Not file-specific"]
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last lines of `%APPDATA%\dam\blendex.log`, if any.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
