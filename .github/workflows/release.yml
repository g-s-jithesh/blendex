name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Build installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.txt -r packaging/requirements.txt
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          app=$(python -c "from backend.app import VERSION; print(VERSION)")
          ui=$(node -p "require('./frontend/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$app" ] || [ "$app" != "$ui" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, backend/app.py VERSION $app and frontend/package.json $ui must all match"
            exit 1
          fi
      - name: Install Inno Setup 6 if missing
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python packaging/build.py
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Blendex-Setup
          path: release/Blendex-*-Setup.exe
          if-no-files-found: error

  linux:
    name: Build Linux tarball
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the system libraries the tarball bundles for Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2 libegl1 libgl1 libnss3 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libxkbcommon-x11-0 libxkbfile1
      - run: python -m pip install -r requirements.txt -r packaging/requirements.txt
      - run: python packaging/build.py
      - uses: actions/upload-artifact@v7
        with:
          name: Blendex-linux
          path: release/Blendex-*-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [installer, linux]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Blendex-Setup
      - uses: actions/download-artifact@v8
        with:
          name: Blendex-linux
      - run: gh release create "$GITHUB_REF_NAME" Blendex-*-Setup.exe Blendex-*-linux-x86_64.tar.gz --repo "$GITHUB_REPOSITORY" --title "Blendex ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
